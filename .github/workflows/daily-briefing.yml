name: Daily Briefing Update

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate briefing data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "🤖 Generating daily briefing..."
          npm run generate:data

          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          YEAR=$(TZ=Asia/Seoul date +%Y)
          MONTH=$(TZ=Asia/Seoul date +%m)

          echo "📅 Processing date: $DATE"

          if [ -f "public/data/latest.json" ] && [ -f "public/data/dates.json" ] && [ -f "public/data/$YEAR/$MONTH/$DATE.json" ]; then
            echo "✅ Briefing data generated successfully"
            ls -lh public/data/latest.json
            ls -lh public/data/dates.json
            ls -lh public/data/$YEAR/$MONTH/$DATE.json
          else
            echo "❌ Missing expected output files"
            echo "Expected: public/data/latest.json"
            echo "Expected: public/data/dates.json"
            echo "Expected: public/data/$YEAR/$MONTH/$DATE.json"
            exit 1
          fi

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          YEAR=$(TZ=Asia/Seoul date +%Y)
          MONTH=$(TZ=Asia/Seoul date +%m)
          BRANCH_NAME="briefing/$DATE"

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add public/data/
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          # 원격에 같은 이름의 브랜치가 있으면 삭제
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          git checkout -b "$BRANCH_NAME"
          git commit -m "chore: update daily briefing [$DATE]"
          git push -u origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "📰 Daily AI Briefing - $DATE" \
            --body "## 📅 Daily AI Briefing - $DATE

          이 PR은 GitHub Actions가 자동 생성한 일일 AI 브리핑 업데이트입니다.

          ### 📦 변경 사항
          - \`public/data/latest.json\` 업데이트
          - \`public/data/dates.json\` 업데이트
          - \`public/data/$YEAR/$MONTH/$DATE.json\` 생성

          ### 🔍 데이터 소스
          - Reddit (r/ChatGPT, r/Singularity)
          - arXiv (cs.AI, cs.LG, cs.CL)
          - OpenAI News
          - Anthropic News
          - Hugging Face Blog
          - Hacker News (LLM/RAG/AI agents)
          - The Verge AI
          - TechCrunch AI

          ---
          🤖 Generated by daily workflow" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "auto-briefing")

          echo "✅ Pull Request created: $PR_URL"

          # 즉시 머지 시도 (PR이 clean status면 성공)
          # 실패 시 (status check 대기 중 등) auto-merge로 fallback
          if gh pr merge "$PR_URL" --squash --delete-branch 2>/dev/null; then
            echo "✅ Pull Request merged immediately"
          else
            echo "⏳ Immediate merge failed, enabling auto-merge..."
            gh pr merge "$PR_URL" --auto --squash --delete-branch
          fi
